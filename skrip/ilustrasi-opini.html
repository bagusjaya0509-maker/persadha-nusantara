<!doctype html>
<!-- Sampul ilustrasi opini DPD Persadha Nusantara NTB (23 Nov 2026). Gambar buatan sendiri, bebas hak cipta pihak lain.
     Render: buka berkas ini dengan ?n=1..7&h=720 (16:9) atau &h=800 (16:10), lalu potret 1280×h. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=IBM+Plex+Mono:wght@600&family=Plus+Jakarta+Sans:wght@500;800&family=Tiro+Devanagari+Sanskrit&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:var(--h,720px);overflow:hidden}
body{position:relative;background:radial-gradient(70% 90% at 72% 42%,#5b1419 0%,#3a0b0f 62%,#2a080b 100%);font-family:'Plus Jakarta Sans';color:#fff}
.bata{position:absolute;inset:0;opacity:.5;background:linear-gradient(rgb(0 0 0/.22) 1px,transparent 1px) 0 0/28px 14px}
.panggung{position:absolute;left:0;top:calc((var(--h,720px) - 720px)/2);width:1280px;height:720px}
.sinar{position:absolute;left:640px;top:30px;width:660px;height:660px;border-radius:50%;background:radial-gradient(circle,rgb(226 196 127/.24),rgb(226 196 127/.05) 52%,transparent 70%)}
.label{position:absolute;left:72px;top:96px;color:#e2c47f;font:800 14px 'Plus Jakarta Sans';letter-spacing:.22em;text-transform:uppercase;display:flex;align-items:center;gap:12px}

.judul{position:absolute;left:72px;top:130px;width:520px;font:600 52px/1.05 'Newsreader';letter-spacing:-.02em}
.judul em{font-style:normal;color:#e2c47f}
.angka{position:absolute;left:74px;top:408px;font:600 64px/1 'IBM Plex Mono';color:#e2c47f;letter-spacing:-.02em}
.ket{position:absolute;left:76px;top:486px;width:470px;color:#d9cabf;font:500 18px/1.45 'Plus Jakarta Sans'}
.merek{position:absolute;left:76px;bottom:52px;color:#c9a04a;font:800 12px 'Plus Jakarta Sans';letter-spacing:.2em;text-transform:uppercase;opacity:.85}
svg.motif{position:absolute;left:640px;top:60px;width:600px;height:600px}
</style></head><body><div class="bata"></div><div class="panggung"><div class="sinar"></div>
<p class="label" id="label"></p><h1 class="judul" id="judul"></h1><p class="angka" id="angka"></p><p class="ket" id="ket"></p>
<p class="merek">Opini · DPD Persadha Nusantara NTB</p>
<svg class="motif" id="motif" viewBox="0 0 600 600"></svg></div>
<script>
const EMAS = '#c9a04a', EMAS2 = '#e2c47f', BATA = '#8f1d21', KREM = '#f6f1e6';
// candi bentar: separuh gerbang bertingkat
function gerbang(x, arah) {
  let d = '', w = 120, y = 520, lebar = 150; const titik = [];
  for (let i = 0; i < 9; i++) { const t = 46 - i * 2; const l = lebar - i * 15; titik.push([l, y - t]); y -= t; }
  let p = `M${x} 560 L${x} 520`;
  let yy = 520;
  for (let i = 0; i < 9; i++) { const l = (lebar - i * 15) * arah; const t = 46 - i * 2; p += ` L${x + l} ${yy} L${x + l} ${yy - t + 8} L${x + l + 10 * arah} ${yy - t + 8} L${x + l + 10 * arah} ${yy - t}`; yy -= t; }
  p += ` L${x} ${yy - 30} Z`;
  return `<path d="${p}" fill="${BATA}" stroke="${EMAS}" stroke-width="3"/>`;
}
const MOTIF = {

    <text x="300" y="300" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="30" fill="${KREM}" opacity=".85">AGAMA HINDU</text>
    <text x="300" y="352" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="24" fill="${EMAS2}">Guru: ______</text>

  3: () => `<g transform="translate(70 120) skewY(-6)"><rect width="460" height="330" fill="#4a1418" stroke="${EMAS}" stroke-width="3" stroke-dasharray="14 10"/>
    <path d="M0 110 H460 M150 0 V330 M310 110 V330" stroke="${EMAS}" stroke-width="1.5" opacity=".4"/>
    ${[[0,0],[460,0],[0,330],[460,330]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9" fill="${EMAS2}"/>`).join('')}</g>
    <g transform="translate(300 330)" fill="${BATA}" stroke="${EMAS2}" stroke-width="3">
      <rect x="-26" y="40" width="52" height="60"/><path d="M-70 40 L70 40 L48 14 L-48 14 Z"/><path d="M-56 14 L56 14 L38 -10 L-38 -10 Z"/><path d="M-44 -10 L44 -10 L28 -32 L-28 -32 Z"/><path d="M-32 -32 L32 -32 L18 -52 L-18 -52 Z"/><path d="M-20 -52 L20 -52 L0 -80 Z"/></g>
    <g transform="translate(430 120) rotate(8)"><rect width="120" height="150" rx="6" fill="${KREM}"/><path d="M20 34 h80 M20 58 h80 M20 82 h56" stroke="#cfc6b6" stroke-width="8" stroke-linecap="round"/><text x="60" y="134" text-anchor="middle" font-family="Newsreader" font-weight="600" font-size="44" fill="${BATA}">?</text></g>`,
  4: () => `<defs><mask id="sabit"><rect width="600" height="600" fill="#fff"/><circle cx="532" cy="96" r="64" fill="#000"/></mask></defs>
    <circle cx="500" cy="120" r="70" fill="${EMAS2}" mask="url(#sabit)"/>
    ${[[420,70],[560,230],[380,180]].map(([x,y])=>`<path d="M${x} ${y-8} L${x+3} ${y-3} L${x+8} ${y} L${x+3} ${y+3} L${x} ${y+8} L${x-3} ${y+3} L${x-8} ${y} L${x-3} ${y-3} Z" fill="${EMAS2}" opacity=".8"/>`).join('')}
    <path d="M150 560 C150 380 170 220 240 150 C290 100 340 110 340 170" fill="none" stroke="${EMAS}" stroke-width="12" stroke-linecap="round"/>
    <path d="M340 170 C342 195 332 216 312 226" fill="none" stroke="${EMAS}" stroke-width="8" stroke-linecap="round"/>
    <path d="M300 226 L324 226 L312 270 Z" fill="${EMAS2}"/>
    ${[0,1,2,3,4,5,6].map(i=>`<path d="M${168+i*4} ${470-i*48} q-34 14 -40 44" fill="none" stroke="${EMAS2}" stroke-width="5" stroke-linecap="round"/>`).join('')}
    <rect x="0" y="560" width="600" height="8" fill="${EMAS}" opacity=".5"/>`,
  6: () => `${[0,1,2,3,4,5].map(i=>`<path d="M0 ${300+i*46} Q300 ${250+i*46} 600 ${300+i*46} L600 ${346+i*46} Q300 ${296+i*46} 0 ${346+i*46} Z" fill="${i%2?'#5f7a3a':'#7d9a48'}" opacity="${1-i*.08}"/>`).join('')}
    ${[[380,210],[440,190],[500,215],[460,250],[530,252]].map(([x,y])=>`<g transform="translate(${x} ${y})"><rect x="-26" y="0" width="52" height="40" fill="${KREM}"/><path d="M-32 2 L0 -26 L32 2 Z" fill="${BATA}"/></g>`).join('')}
    <path d="M330 300 C300 270 260 262 220 270" fill="none" stroke="${EMAS2}" stroke-width="5" stroke-dasharray="10 8"/><path d="M226 258 L210 272 L230 282" fill="none" stroke="${EMAS2}" stroke-width="5"/>`,
  7: () => `${[0,1,2,3,4,5].map(i=>`<g transform="translate(90 ${130+i*62}) rotate(${-4+i*1.5})"><rect width="420" height="44" rx="6" fill="#d9b978" stroke="#8a6a2c" stroke-width="2"/><circle cx="210" cy="22" r="6" fill="#3a0b0f"/><path d="M40 16 h120 M260 16 h120 M40 28 h90 M260 28 h100" stroke="#6b4e1a" stroke-width="3" stroke-linecap="round" opacity=".7"/></g>`).join('')}
    <path d="M300 110 V520" stroke="${BATA}" stroke-width="4"/>
    <g transform="translate(460 470)"><circle r="54" fill="#3a0b0f" stroke="${EMAS2}" stroke-width="4"/><text y="16" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="44" fill="${EMAS2}">21</text></g>`,
};
const DATA = {
  1: ['Kebebasan beribadah', 'Hak beribadah tidak boleh <em>menunggu restu</em>', '90 / 60', 'Syarat jumlah pengguna dan dukungan warga yang masih dipertahankan Rancangan Perpres Kerukunan'],
  2: ['Pendidikan agama', 'Anak Hindu berhak atas <em>guru agamanya</em>', '17 siswa', 'Siswa Hindu SDN 02 Labuhan Kananga, Tambora, yang tidak memiliki guru agama Hindu'],
  3: ['Tanah pura', 'Pura tanpa sertifikat, <em>menunggu digugat</em>', '1.359 / 1.662', 'Pura bersertifikat lewat program nasional hingga Oktober 2023 yang berada di Bali'],
  4: ['Toleransi', 'Ogoh-ogoh di bulan Ramadan: <em>dua arah</em>', '182 → 105', 'Jumlah ogoh-ogoh di pawai Mataram, tahun sebelumnya dan Nyepi 2026'],
  6: ['Tri Hita Karana', 'Sawah menyusut, <em>palemahan</em> dipertaruhkan', '509 ha', 'Luas lahan sawah dilindungi yang tersisa di Kota Mataram'],
  7: ['Pembinaan umat', 'Penyuluh agama Hindu, <em>garda depan</em>', '21 orang', 'Penyuluh agama Hindu non-PNS di Kota Mataram, masih jauh dari kebutuhan umat'],
};
const q = new URLSearchParams(location.search); const n = +q.get('n'); const h = +(q.get('h') || 720);
document.documentElement.style.setProperty('--h', h + 'px');
const [l, j, a, k] = DATA[n];
label.textContent = l; judul.innerHTML = j; angka.textContent = a; ket.textContent = k; document.getElementById("motif").innerHTML = MOTIF[n]();
</script></body></html>
